[workspace]
name = "hedge-fund"
version = "0.1.0"
description = "Hybrid hedge fund: deterministic quant core plus LLM research layer"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.14"
pandas = ">=3.0"
numpy = ">=1.26"
scipy = ">=1.11"
plotly = ">=5.18.0"
streamlit = ">=1.50"
requests = ">=2.31.0"
pyyaml = ">=6.0"
pip = "*"
setuptools = ">=61"
# TradingAgents (sibling fork ../TradingAgents) runtime deps, from conda-forge
langchain-core = ">=1.6.5"
langchain-anthropic = ">=1.7.4"
langchain-google-genai = ">=4.4.0"
langchain-openai = ">=1.6.6"
langgraph = ">=1.2.12"
markdown-it-py = ">=4.0"
python-dotenv = ">=1.0.0"
pytz = ">=2025.2"
questionary = ">=2.1.0"
rich = ">=14.0.0"
typer = ">=0.21.0"
typing-extensions = ">=4.14.0"
yfinance = ">=1.7.0"
pyarrow = ">=15"
pandas-ta = "*"

[tasks]
install-editable = "python -m pip install --no-deps --no-build-isolation -e ."
install-tradingagents = "python -m pip install --no-deps --no-build-isolation -e ../TradingAgents"
setup-dev = { depends-on = ["install-editable", "install-tradingagents"] }

[feature.ci.dependencies]
ruff = ">=0.8.4"
mypy = ">=1.14.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
bandit = ">=1.8.0"
pre-commit = ">=4.0.0"
python-build = ">=1.0.0"
hatchling = ">=1.21.0"

[feature.ci.tasks]
lint = "ruff check ."
lint-fix = "ruff check --fix ."
format = "ruff format ."
format-check = "ruff format --check ."
type-check = "mypy src/"
quality = { depends-on = ["lint", "format-check", "type-check"] }
test = "pytest tests/ --cov=hedge_fund --cov-report=term-missing"
security = "bandit -c pyproject.toml -r src/"
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run --all-files"
build = "python -m build"

[feature.dev.tasks]
app = "streamlit run app.py"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[environments]
default = { solve-group = "default" }
dev = { features = ["ci", "dev"], solve-group = "default" }
ci = { features = ["ci"], solve-group = "default" }
py311 = { features = ["py311", "ci"], solve-group = "py311" }
py312 = { features = ["py312", "ci"], solve-group = "py312" }
quality-extended = { features = ["ci"], solve-group = "default" }
quality-ci = { features = ["ci"], solve-group = "default" }
