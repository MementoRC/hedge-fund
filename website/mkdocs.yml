site_name: hedge-fund
site_description: A paper-trading hybrid hedge fund with a deterministic quant core and an LLM research layer.
repo_url: https://github.com/MementoRC/hedge-fund
repo_name: MementoRC/hedge-fund
docs_dir: docs

theme:
  name: material
  # TODO(S2/polish): the colours below are Material's defaults. The shared palette lives in
  # hedge_fund.viz.theme (built in PR0); polish wires it in through extra CSS. Do not invent
  # a second palette here.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - A cycle, step by step: cycle.md
  - Design rules: design-rules.md
  - Backtest methodology: backtest-methodology.md
