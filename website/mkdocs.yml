site_name: hedge-fund
site_description: A paper-trading hybrid hedge fund with a deterministic quant core and an LLM research layer.
repo_url: https://github.com/MementoRC/hedge-fund
repo_name: MementoRC/hedge-fund
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Written by `hedge-fund site build` (pixi run -e site site). Chart colours come from
# hedge_fund.viz.theme through palette.css; plotly.min.js must load before charts.js.
extra_css:
  - generated/assets/palette.css
extra_javascript:
  - generated/assets/plotly.min.js
  - generated/assets/charts.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - A cycle, step by step: cycle.md
  - Design rules: design-rules.md
  - Backtest methodology: backtest-methodology.md
  - Results:
      - Portfolio: generated/portfolio.md
      - Cycles: generated/cycles.md
      - Backtest: generated/backtests.md
      - Stats: generated/stats.md
